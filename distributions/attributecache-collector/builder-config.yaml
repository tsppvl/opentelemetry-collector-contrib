# Full otelcol-contrib distribution + custom attributecache processor and
# neo4j_query receiver.
# Component list mirrors the official otelcol-contrib v0.164.0 manifest
# (opentelemetry-collector-releases/distributions/otelcol-contrib), except the
# obi eBPF receiver (needs a vendored source archive). All contrib components
# are sourced from the local fork checkout (see replaces: section).
# v0.164.1-tsp is the version of this custom distribution.
#
# Local build — from repo root:
#   cp distributions/attributecache-collector/builder-config.yaml /tmp/builder-config-with-replaces.yaml
#   find . -type f -name "go.mod" -exec dirname {} \; | sort | while read mod_path; do
#     mod="${mod_path#.}"
#     [[ "$mod" == */distributions/attributecache-collector/bin* ]] && continue
#     echo "  - github.com/open-telemetry/opentelemetry-collector-contrib${mod} => ../../..${mod}" >> /tmp/builder-config-with-replaces.yaml
#   done
#   cd distributions/attributecache-collector
#   go run go.opentelemetry.io/collector/cmd/builder@v0.164.0 \
#     --config /tmp/builder-config-with-replaces.yaml
#
# CI release: push tag  collector/v0.164.1-tsp  (or any collector/v* tag)

dist:
  module: github.com/tsppvl/otelcol-attributecache
  name: otelcol-attributecache
  description: OpenTelemetry Collector Contrib with attributecache processor and neo4j_query receiver
  version: 0.164.1-tsp
  output_path: ./bin
  build_tags: "grpcnotrace"

